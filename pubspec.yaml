name: ecoach_pro
description: "eCoach Pro - Train like a pro. Soccer & football training app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management, routing & dependency injection
  get: ^4.7.2

  # Simple key-value persistence (onboarding flag, etc.)
  shared_preferences: ^2.5.3

  # Video playback (training & skills videos)
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates the native (pre-Flutter) launch screen so there is no white flash.
  # Run once:  dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    # Resolution-aware: logo.png (1x), 2.0x/logo.png, 3.0x/logo.png
    - assets/images/
    - assets/images/icons/
    - assets/images/icons/choice/
    - assets/images/icons/menu/
    - assets/images/training/
    - assets/images/skills/
    - assets/images/drills/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

# Native launch screen: solid brand colour only. The animated logo is shown by
# the Flutter splash page, so the two never fight over logo size/position.
flutter_native_splash:
  color: "#09232A"
  android_12:
    color: "#09232A"
